<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper Card Slider</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Swiper CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #131313;
      }

      .swiper {
        width: 90%;
        padding: 50px 0;
      }

      .swiper-slide {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        position: relative;
        width: 320px;
        height: 450px;
        background: #232323;
        border-radius: 20px;
        overflow: hidden;
      }

      .card:before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #9bdc28;
        clip-path: circle(150px at 80% 20%);
        transition: 0.5s ease-in-out;
      }

      .card:hover:before {
        clip-path: circle(300px at 80% -20%);
      }

      .card:after {
        content: "DIARY";
        position: absolute;
        top: 30%;
        left: -20%;
        font-size: 12em;
        font-weight: 800;
        font-style: italic;
        color: rgba(255, 255, 255, 0.05);
      }

      .card .imgBx {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        width: 100%;
        height: 220px;
        transition: 0.5s;
      }

      .card:hover .imgBx {
        top: 0%;
        transform: translateY(0%);
      }

      .card .imgBx img {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-25deg);
        width: 270px;
      }

      .card .contentBx {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 100px;
        text-align: center;
        transition: 1s;
        z-index: 10;
      }

      .card:hover .contentBx {
        height: 210px;
      }

      .card .contentBx h2 {
        color: #fff;
        font-weight: 600;
        letter-spacing: 1px;
        margin: 0;
      }

      .size, .color {
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        transition: 0.5s;
      }

      .card:hover .size, .card:hover .color {
        opacity: 1;
        visibility: visible;
      }

      .size h3, .color h3 {
        color: #fff;
        font-weight: 300;
        font-size: 14px;
        text-transform: uppercase;
        margin-right: 10px;
      }

      .size span, .color span {
        width: 26px;
        height: 26px;
        text-align: center;
        line-height: 26px;
        font-size: 14px;
        background: #fff;
        margin: 0 5px;
        border-radius: 4px;
        cursor: pointer;
      }

      .size span:hover {
        background: #9bdc28;
      }

      .color span {
        width: 20px;
        height: 20px;
        border-radius: 50%;
      }

      .color span:nth-child(1) { background: yellow; }
      .color span:nth-child(2) { background: #9bdc28; }
      .color span:nth-child(3) { background: #03a9f4; }

      .card .contentBx a {
        display: inline-block;
        padding: 10px 20px;
        background: #fff;
        border-radius: 4px;
        text-decoration: none;
        font-weight: 600;
        color: #111;
        opacity: 0;
        transform: translateY(50px);
        transition: 0.5s;
      }

      .card:hover .contentBx a {
        opacity: 1;
        transform: translateY(0px);
      }

      /* Swiper Navigation */
      .swiper-button-next,
      .swiper-button-prev {
        color: #fff;
      }

    </style>
  </head>

  <body>
    <!-- Swiper -->
    <div class="swiper">
      <div class="swiper-wrapper">
        <!-- Slide 1 -->
        <div class="swiper-slide">
          <div class="card">
            <div class="imgBx">
              <img src="https://assets.codepen.io/4164355/shoes.png" />
            </div>
            <div class="contentBx">
              <h2>Nike Shoes</h2>
              <div class="size">
                <h3>Size :</h3>
                <span>7</span><span>8</span><span>9</span><span>10</span>
              </div>
              <div class="color">
                <h3>Color :</h3>
                <span></span><span></span><span></span>
              </div>
              <a href="#">Buy Now</a>
            </div>
          </div>
        </div>

        <!-- Duplicate the card structure for other slides -->
        <div class="swiper-slide">
          <div class="card">
            <div class="imgBx">
              <img src="https://assets.codepen.io/4164355/shoes.png" />
            </div>
            <div class="contentBx">
              <h2>Nike Air</h2>
              <div class="size"><h3>Size :</h3><span>6</span><span>8</span></div>
              <div class="color"><h3>Color :</h3><span></span><span></span></div>
              <a href="#">Buy Now</a>
            </div>
          </div>
        </div>

        <div class="swiper-slide">
            <div class="card">
              <div class="imgBx">
                <img src="https://assets.codepen.io/4164355/shoes.png" />
              </div>
              <div class="contentBx">
                <h2>Nike Air</h2>
                <div class="size"><h3>Size :</h3><span>6</span><span>8</span></div>
                <div class="color"><h3>Color :</h3><span></span><span></span></div>
                <a href="#">Buy Now</a>
              </div>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="card">
              <div class="imgBx">
                <img src="https://assets.codepen.io/4164355/shoes.png" />
              </div>
              <div class="contentBx">
                <h2>Nike Air</h2>
                <div class="size"><h3>Size :</h3><span>6</span><span>8</span></div>
                <div class="color"><h3>Color :</h3><span></span><span></span></div>
                <a href="#">Buy Now</a>
              </div>
            </div>
          </div>
        <!-- Add more slides as needed -->
      </div>

      <!-- Add Pagination -->
      <div class="swiper-pagination"></div>

      <!-- Add Navigation -->
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
      const swiper = new Swiper(".swiper", {
        slidesPerView: 3,
        spaceBetween: 30,
        loop: true,
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });
    </script>
  </body>
</html>
